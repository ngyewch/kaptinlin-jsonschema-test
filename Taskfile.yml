version: 3

tasks:
  preBuild:
    desc: Pre-build
    cmds:
      - go generate
      - go mod tidy

  test:
    desc: Test
    deps: [ preBuild ]
    cmds:
      - go test ./...

  dependencyUpdates:
    desc: Show dependency updates
    aliases: [ outdated ]
    deps: [ preBuild ]
    cmds:
      - go list -u -m -json all | go-mod-outdated -update -direct

  mingo:
    deps: [ preBuild ]
    cmds:
      - mingo -tests -v
